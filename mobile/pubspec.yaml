name: market_sphere
description: Market Sphere Group — native Android app sharing the website Supabase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  provider: ^6.1.5
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.5
  permission_handler: ^12.0.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  path: ^1.9.1
  share_plus: ^13.3.0
  app_links: ^7.0.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: 10.3.1
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/logo-512.png
  adaptive_icon_background: "#0B0B0B"
  adaptive_icon_foreground: assets/branding/logo-512.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 24

flutter_native_splash:
  color: "#0B0B0B"
  image: assets/branding/logo-512.png
  android: true
  ios: false
  android_12:
    color: "#0B0B0B"
    image: assets/branding/logo-512.png
    icon_background_color: "#0B0B0B"
